name: ci

on: [push, pull_request]

jobs:
  backend-bootstrap:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:6.0.2@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -e "./backend[dev]"
      - name: Check dependency imports
        run: >-
          python -c "import anthropic, fastapi, falkordb, httpx, jellyfish,
          mcp, pydantic, rapidfuzz, unidecode, uvicorn, dotenv"
      - name: Verify FalkorDB platform facts
        run: python scripts/verify_falkordb.py
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Run deterministic golden gate
        working-directory: backend
        run: python -m eval.run_golden --gate

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelltrace"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
  "falkordb>=1.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "mcp>=1.12,<2",
  "anthropic>=1.0",
  "httpx>=0.27",
  "rapidfuzz>=3.9",
  "unidecode>=1.3",
  "jellyfish>=1.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6.100"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["shelltrace*", "eval*"]

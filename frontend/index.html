<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101f2c" />
    <script>
      try {
        const saved = localStorage.getItem('shelltrace-theme');
        const theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch { /* The app resolves the system theme when storage is unavailable. */ }
    </script>
    <meta name="description" content="ShellTrace sanctions exposure investigation workspace" />
    <title>ShellTrace — Investigation workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
